<div class="verify-container">
  <div class="verify-box">

    @if (loading) {
      <div class="verify-loading">
        <div class="spinner"></div>
        <p>Verificando tu email...</p>
      </div>
    } @else if (success) {
      <div class="verify-success">
        <span class="verify-icon">✅</span>
        <h1>EMAIL VERIFIC<span>ADO</span></h1>
        <p>Tu cuenta ha sido verificada correctamente. Ya puedes disfrutar de todas las funcionalidades de RankIA Log.</p>
        <a routerLink="/" class="btn-primary">Ir al inicio</a>
      </div>
    } @else {
      <div class="verify-error">
        <span class="verify-icon">❌</span>
        <h1>ERROR DE VERIFIC<span>ACIÓN</span></h1>
        <p>{{ error }}</p>
        <a routerLink="/" class="btn-secondary">Volver al inicio</a>
      </div>
    }

  </div>
</div>
