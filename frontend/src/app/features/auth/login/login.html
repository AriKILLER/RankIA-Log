<div class="auth-container">
  <div class="auth-box">
    <div class="auth-header">
      <h1>INIC<span>IA</span> SESIÓN</h1>
      <p>Bienvenido de nuevo a RankIA Log</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="tu@email.com" />
        @if (email.invalid && email.touched) {
          <span class="error">Email inválido</span>
        }
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password" placeholder="••••••••" />
      </div>

      <div class="forgot-link">
        <a routerLink="/forgot-password">¿Olvidaste tu contraseña?</a>
      </div>

      @if (error) {
        <p class="error-global">{{ error }}</p>
      }

      <button class="btn-primary" type="submit" [disabled]="form.invalid || loading">
        {{ loading ? 'Entrando...' : 'Iniciar sesión' }}
      </button>
    </form>

    <div class="auth-footer">¿No tienes cuenta? <a routerLink="/register">Regístrate</a></div>
  </div>
</div>
